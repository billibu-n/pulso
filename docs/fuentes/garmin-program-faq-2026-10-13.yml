      - generic [ref=e46]:
        - heading "Garmin Connect Developer Program FAQ" [level=2] [ref=e47]
        - paragraph [ref=e48]: The Garmin Connect Developer Program is available for enterprise use and is the quickest way to make Garmin devices a part of your platform or provide coaching or training plans to users on their Garmin wearables. If you are interested, please request the Garmin Connect Developer Program and we’ll quickly review your application.
        - paragraph [ref=e49]: Before you do so, you may want to go through these frequently asked questions. You can also find content specific to each API in the left menu.
        - paragraph [ref=e50]:
          - strong [ref=e51]: What is the cost of the Garmin Connect Developer Program?
          - paragraph [ref=e52]: There are no licensing or maintenance fees for access to the Garmin Connect Developer Program, but it is only for business use. Access to some metrics may require a license fee payment or minimum device order quantity for commercial use.
        - paragraph [ref=e53]:
          - strong [ref=e54]: What is the integration process like and how long does it take?
          - paragraph [ref=e55]: After you request the Garmin Connect Developer Program, we will confirm the status of your application within two business days. If approved, you will be granted access to the Garmin Developer Portal and can get started on your integration right away. In parallel, we will invite you to an integration call to help understand your needs and walk you through the high-level technical details of the Developer Program and its APIs. A typical integration takes between 1 and 4 weeks.
        - paragraph [ref=e56]:
          - strong [ref=e57]: Do the Garmin Connect Developer Program APIs support all upcoming new devices?
          - paragraph [ref=e58]: Yes, new devices are supported automatically. Additionally, the Garmin Connect Developer Program team makes every effort to ensure new data types are available as new devices launch, however it’s not always possible to offer every metric. If you need data that is not already included, please contact support with your request.
        - paragraph [ref=e59]:
          - strong [ref=e60]: Can I use multiple APIs for integration with my application?
          - paragraph [ref=e61]: Yes, you may use utilize any or all APIs in a single application (Health, Activity, Women’s Health, Training, and Courses).
        - paragraph [ref=e62]:
          - strong [ref=e63]: What OAuth format do the Developer Program APIs use?
          - paragraph [ref=e64]: All APIs in the Developer Program use OAUTH 2.0.
        - paragraph [ref=e65]:
          - strong [ref=e66]: I see the Connect IQ developer program allows for the creation of watch faces, data fields, widgets and applications. Do I need the Connect API to use this program?
          - paragraph [ref=e67]:
            - text: No, the Garmin Connect Developer Program APIs and the Connect IQ programs are different programs. One does not require the use of the other. Learn more about
            - link "Connect IQ" [ref=e68] [cursor=pointer]:
              - /url: /connect-iq/overview/
            - text: and start using our free SDK.
        - paragraph [ref=e69]:
          - strong [ref=e70]: Can I include Garmin wearables in my project / offering?
          - paragraph [ref=e71]: Absolutely. If you want to enhance your project by offering Garmin wearables, please request the Garmin Connect Developer Program and enter the number of devices you believe you will support. A member of the Garmin team will contact you to discuss how best to sell and provide the wearables to your users.
        - paragraph [ref=e72]:
          - strong [ref=e73]: For further questions
          - text: ", get in contact with us by"
          - link "emailing us" [ref=e74] [cursor=pointer]:
            - /url: mailto:connect-support@developer.garmin.com
          - text: .
