[package]
name = "motor"
version = "0.1.0"
edition = "2021"
# Con 18 binarios, `cargo run` a secas NO SABE cual es la aplicacion y falla. Esta linea dice cual es
# la puerta de entrada. Los demas son INSTRUMENTOS de medida, no la aplicacion.
default-run = "pulso"
description = "El motor de análisis de entrenamiento: calcula, decide qué se puede afirmar, y lo justifica."
license = "POR-DECIDIR"

[dependencies]
# Para leer el JSON del cliente. La version se fija AQUI y se sube a proposito, no sola.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# El lector de FIT. Es la libreria mas viva: 82.000 descargas, actualizada este ano.
# Las otras dos estan abandonadas (una de 2020, otra de 2023).
fitparser = "0.11"
# La interfaz. Version fijada a proposito, no flotante.
slint = { version = "1", features = ["renderer-software"] }
# Para ABRIR el ZIP de la exportacion de Huawei sin que el cliente lo descomprima (decision del dueño,
# 2026-10-14). Se fija la version EXACTA y se apagan las funciones que no se usan -- solo hace falta
# DEFLATE, que es lo que traen los ZIP normales: cada funcion de mas es una dependencia de mas.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[[bin]]
name = "pulso"
path = "src/bin/pulso.rs"

[build-dependencies]
slint-build = "1"

# ---- Para MEDIR la interfaz sin abrir ventana (AU-63) ----
#
# `i-slint-backend-testing` deja consultar la GEOMETRIA de los elementos: su posicion y su tamano.
# Es lo que faltaba: hasta ahora la unica forma de saber como quedaba la pantalla era abrirla y
# mirarla, o pedirle una captura al dueno. **Con esto se mide.**
#
# Va en `dev-dependencies` porque SOLO se usa en las pruebas: la aplicacion no lo lleva.
[dev-dependencies]
i-slint-backend-testing = "1.18"
